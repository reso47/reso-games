<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaktions-Tester • Reso</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0a0a0f; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
        h1 { color: #ffcc00; margin-bottom: 2rem; }
        #klickFeld { width: 320px; height: 320px; background: #e63946; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; text-align: center; padding: 1rem; cursor: pointer; transition: background 0.1s; margin-bottom: 2rem; }
        .gruen { background: #2ecc71 !important; }
        #ergebnis { font-size: 1.5rem; text-align: center; line-height: 1.8; }
        .btn { padding: 0.8rem 2rem; font-size: 1.1rem; background: #ffcc00; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 2rem; }
        .versteckt { display: none !important; }
    </style>
</head>
<body>
    <h1>⏱️ Reaktions-Tester</h1>
    <div id="klickFeld">Klicke hier zum Starten!</div>
    <div id="ergebnis" class="versteckt"></div>
    <button class="btn" onclick="window.close()">Zurück zur Übersicht</button>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCQbprCOYFqrCI24UXG41Qij8e0F0RrNio",
    authDomain: "reso-games.firebaseapp.com",
    databaseURL: "https://reso-games-default-rtdb.firebaseio.com",
    projectId: "reso-games",
    storageBucket: "reso-games.appspot.com",
    messagingSenderId: "760572638180",
    appId: "1:760572638180:web:85545412c80726b68c4df1"
};
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const feld = document.getElementById('klickFeld');
const ergebnisFeld = document.getElementById('ergebnis');
const meinName = localStorage.getItem('resoGamertag') || 'Gast';

let startZeit = 0, warte = false, aktiv = false;

feld.addEventListener('click', async () => {
    if(!aktiv && !warte) { starteRunde(); return; }
    if(warte) { feld.textContent = "❌ ZU FRÜH!\nNochmal klicken!"; warte = false; return; }
    if(aktiv) {
        const reaktionsZeit = Date.now() - startZeit;
        aktiv = false;
        ergebnisFeld.classList.remove('versteckt');
        ergebnisFeld.innerHTML = `Deine Zeit: <strong style="color:#ffcc00; font-size:2rem">${reaktionsZeit} ms</strong><br>✅ Gespeichert! Klicke nochmal!`;

        // IN DIE GEMEINSAME BESTENLISTE SPEICHERN
        const ref = db.ref('bestenliste/reaktionstester/' + meinName);
        const alterWert = await ref.once('value');
        if(!alterWert.exists() || reaktionsZeit < alterWert.val()) {
            await ref.set(reaktionsZeit);
        }

        feld.classList.remove('gruen');
        feld.textContent = "Klicke zum Starten!";
    }
});

function starteRunde() {
    feld.classList.remove('gruen');
    ergebnisFeld.classList.add('versteckt');
    feld.textContent = "Warte... bis es GRÜN wird!";
    warte = true;
    setTimeout(() => {
        warte = false; aktiv = true;
        feld.classList.add('gruen');
        feld.textContent = "✅ JETZT KLICKEN!";
        startZeit = Date.now();
    }, Math.random() * 3000 + 1000);
}
</script>
</body>
</html>
